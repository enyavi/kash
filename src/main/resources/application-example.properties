spring.application.name=kash

spring.datasource.url=jdbc:h2:file:./data/kash-dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# Claude API
anthropic.api.key=YOUR_ANTHROPIC_API_KEY_HERE
telegram.bot.token=YOUR_TELEGRAM_BOT_TOKEN_HERE
telegram.bot.username=YOUR_BOT_USERNAME_HERE